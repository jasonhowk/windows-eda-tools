name: Test Digital package

on:
  workflow_dispatch:
  push:
    paths:
      - bucket/digital.json
      - .github/workflows/test-digital.yml

permissions:
  contents: read

jobs:
  digital:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Scoop
        shell: pwsh
        run: |
          irm get.scoop.sh | iex
          $shimPath = Join-Path $env:USERPROFILE 'scoop\shims'
          $shimPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Git bucket prerequisite
        shell: pwsh
        run: scoop install git

      - name: Add dependency and local buckets
        shell: pwsh
        run: |
          scoop bucket add java
          scoop bucket add eda-tools https://github.com/jasonhowk/windows-eda-tools

      - name: Install Digital
        shell: pwsh
        run: scoop install eda-tools/digital

      - name: Verify Digital installation
        shell: pwsh
        run: |
          $prefix = scoop prefix digital
          if (-not (Test-Path (Join-Path $prefix 'Digital.jar'))) {
            throw "Digital.jar was not installed under $prefix"
          }

          if (-not (Get-Command digital -ErrorAction SilentlyContinue)) {
            throw "The digital command shim was not created"
          }

          java -version
          scoop shim info Digital
